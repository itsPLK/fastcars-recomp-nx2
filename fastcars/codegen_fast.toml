# Faster code generation (perf branch): opt in from a manifest with
#   includes = ["codegen_fast.toml"]   (in [entrypoint])
# Every option keeps a register (or the link / machine state register) out of PPCContext, so
# clang can keep it in a host register instead of loading and storing ctx around every use.
#   skip_lr     no ctx.lr bookkeeping (no guest code reads it: no blrl; host only for diagnostics)
#   skip_msr    no mfmsr/mtmsrd global-lock calls and fences (same as --fastcars_global_lock_off)
#   *_as_local  ctr, xer, cr0-7, r0/r2/r11/r12/f0/v32-63 and the non-volatiles
#               r14-31/f14-31/v14-31/v64-127 as C++ locals of each function
# Not reserved_as_local: the lwarx reservation is per-thread CPU state that the game passes
# between functions (sub_83829CC0 is an ldarx helper, sub_83829CD8 the matching stdcx.); as a
# local it is lost and that compare-and-swap never succeeds (threads spin forever).
#   memory_classes  stack (r1-relative) and in-loop accesses get their own macros (fastcars_pch.h:
#               stack plain, loops volatile, the rest volatile unless FASTCARS_PLAIN_MEMORY), and
#               the prologue's dead saves of localized registers are dropped
# Functions that do not follow the calling convention (they read a register their caller or
# callee left in ctx) keep everything in ctx: codegen_share_registers.toml, generated by
# tools/codegen/register_livein.py from codegen output made without these options.
skip_lr = true
skip_msr = true
ctr_as_local = true
xer_as_local = true
cr_as_local = true
non_argument_as_local = true
non_volatile_as_local = true
memory_classes = true
includes = ["codegen_share_registers.toml"]
